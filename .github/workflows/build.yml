name: Build Exter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller<6"

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name Exter Exter.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Exter-Windows
          path: dist/Exter.exe
